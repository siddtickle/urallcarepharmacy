# Paste this at https://api.slack.com/apps → Create New App → From an app manifest.
# Replace api.urallcarepharmacy.com if your backend lives somewhere else.
display_information:
  name: AllCare Website
  description: Website messages, Google reviews and website changes for AllCare Pharmacy
  background_color: "#0f417f"
features:
  bot_user:
    display_name: AllCare Website
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # post messages and replies
      - reactions:write     # mark replies as sent
      - channels:history    # read thread replies in public channels
      - groups:history      # read thread replies in private channels
      - files:read          # photos attached to change requests
      - files:write         # upload preview screenshots
settings:
  event_subscriptions:
    request_url: https://api.urallcarepharmacy.com/slack/events
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://api.urallcarepharmacy.com/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
